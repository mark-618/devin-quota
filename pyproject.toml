[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-quota"
version = "0.1.0"
description = "Devin weekly quota burn dashboard — opencode-style local monitor"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
devin-quota = "devin_quota.server:main"

[tool.setuptools]
packages = ["devin_quota"]

[tool.setuptools.package-data]
devin_quota = ["dashboard.html"]
