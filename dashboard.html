<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin Weekly Quota</title>
<style>
:root{
  --bg:#141416;
  --card:#1e1e21;
  --card2:#232327;
  --text:#e8e8ea;
  --sub:#8e8e95;
  --faint:#5b5b63;
  --hair:#2e2e33;
  --usage:#3ddc84;
  --fc:#f5c97b;
  --hot:#c77dff;
  --limit:#6e6e76;
  --blue:#0a84ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:26px 26px 60px}

.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hdr .t{font-size:15px;font-weight:600}
.hdr .t small{color:var(--sub);font-weight:400}
.hdr .right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);
  background:var(--card2);border:1px solid var(--hair);border-radius:8px;padding:6px 12px;cursor:pointer}
.pill:hover{background:#2a2a2f}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--usage)}
.pill .dot.err{background:var(--red,#ff453a)}

.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:22px 24px 16px;position:relative}
#cv{cursor:crosshair;user-select:none}
#tip{position:absolute;display:none;pointer-events:none;background:#2a2a2f;border:1px solid var(--hair);
  border-radius:8px;padding:7px 10px;font-size:11.5px;color:var(--text);white-space:nowrap;z-index:5;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
#tip .tt{color:var(--faint);margin-bottom:2px}
#tip .u{color:var(--usage)}#tip .f{color:var(--fc)}#tip .p{color:var(--sub)}

.top{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.top .pct{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.top .meta{font-size:14px;color:var(--sub)}
.top .meta b{color:var(--fc);font-weight:600}
.top .meta b.ok{color:var(--usage)}
.top .meta i{font-style:normal;margin:0 4px;color:var(--faint)}

#cv{width:100%;height:320px;display:block;margin-top:10px}

.xbar{display:flex;justify-content:space-between;margin:8px -4px 0;position:relative}
.xbar .x{font-size:11px;font-weight:600;color:var(--sub);background:var(--card2);border-radius:7px;padding:4px 10px;white-space:nowrap}
.xbar .x.hit{color:var(--fc)}
.xbar .x.end{color:var(--faint)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.foot .avg{font-size:13px;color:var(--sub)}
.foot .avg b{color:var(--text);font-weight:600}
.legend{display:flex;gap:22px;font-size:12px;color:var(--sub)}
.legend .sw{display:inline-block;width:16px;height:2px;border-radius:2px;vertical-align:3px;margin-right:7px}
.legend .sw.dash{background:repeating-linear-gradient(90deg,var(--fc) 0 4px,transparent 4px 7px)}
.legend .sw.dots{background:repeating-linear-gradient(90deg,var(--limit) 0 3px,transparent 3px 6px)}
.legend .sw.pace{background:repeating-linear-gradient(90deg,#4e4e58 0 4px,transparent 4px 8px)}

.sub-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
@media(max-width:760px){.sub-cards{grid-template-columns:repeat(2,1fr)}}
.mini{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px}
.mini .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.mini .v{font-size:20px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.mini .v small{font-size:12px;color:var(--sub);font-weight:400}
.mini .s{font-size:11px;color:var(--sub);margin-top:3px}

footer{margin-top:24px;font-size:11px;color:var(--faint);text-align:center}
footer code{background:var(--card2);border-radius:5px;padding:1px 6px;font-size:10.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="t">Devin 额度 <small>· weekly quota burn</small></div>
    <div class="right">
      <div class="pill"><span class="dot" id="liveDot"></span><span id="liveTxt">Live</span> · <span id="clock">—</span></div>
      <div class="pill" onclick="refresh(true);setTimeout(()=>refresh(false),4500)">Refresh</div>
    </div>
  </div>

  <div class="card">
    <div class="top">
      <div class="pct" id="pct">—</div>
      <div class="meta" id="meta">读取中…</div>
    </div>
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div class="xbar" id="xbar"></div>
    <div class="foot">
      <div class="avg" id="avg">—</div>
      <div class="legend">
        <span><span class="sw" style="background:var(--usage)"></span>Usage</span>
        <span><span class="sw pace"></span>Even pace</span>
        <span><span class="sw dash"></span>Forecast</span>
        <span><span class="sw" style="background:repeating-linear-gradient(90deg,var(--hot) 0 3px,transparent 3px 6px)"></span>Hot pace</span>
        <span><span class="sw dots"></span>Weekly limit</span>
      </div>
    </div>
  </div>

  <div class="sub-cards">
    <div class="mini"><div class="k">剩余额度</div><div class="v" id="mRemain">—</div><div class="s" id="mRemainS"></div></div>
    <div class="mini"><div class="k">距重置</div><div class="v" id="mReset">—</div><div class="s" id="mResetS"></div></div>
    <div class="mini"><div class="k">燃烧速度</div><div class="v" id="mRate">—</div><div class="s" id="mRateS"></div></div>
    <div class="mini"><div class="k">本小时</div><div class="v" id="mHour">—</div><div class="s" id="mHourS"></div></div>
    <div class="mini"><div class="k">今日</div><div class="v" id="mToday">—</div><div class="s" id="mTodayS"></div></div>
    <div class="mini"><div class="k">超额余额</div><div class="v" id="mOver">—</div><div class="s" id="mOverS"></div></div>
  </div>

  <footer>数据源 <code>api.devin.ai · billing/quota/usage</code>(app.devin.ai 官方页面同源) · 每 60s 刷新 · 历史 <code>history.jsonl</code> · 拖动框选/双指捏合缩放 · 横滚平移 · 双击还原</footer>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const DAY=864e5;
const fmtD=t=>new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"});
const fmtDT=t=>new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtDur=ms=>{const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5);return d?d+"d "+h+"h":Math.floor(ms/36e5)+"h "+Math.floor(ms%36e5/6e4)+"m"};

let state=null, view=null, hoverT=null, dragT0=null, dragT1=null;

async function refresh(force){
  try{
    state=await (await fetch("/api/state"+(force?"?refresh=1":""),{cache:"no-store"})).json();
    $("liveDot").className="dot";$("liveTxt").textContent="Live";
    $("clock").textContent=new Date().toLocaleTimeString("en-GB");
    render();
  }catch(e){$("liveDot").className="dot err";$("liveTxt").textContent="offline";}
}

function render(){
  const q=state.latest.quota||{}, st=state.latest.stats||{}, lim=state.latest.limits||{}, p=state.prediction||{};
  const now=Date.now();
  const pct=q.weekly_percentage??0;
  const resetT=new Date(q.weekly_reset_at).getTime();
  const weekStart=resetT-7*DAY;

  $("pct").textContent=Math.round(pct)+"%";
  // headline: "Weekly usage · Ends Nov 1 · On pace to hit the limit Oct 30"
  let paceHtml;
  if(p.rate_per_day!=null&&p.rate_per_day>0&&p.exhaust_ts&&p.exhaust_ts*1000<resetT){
    paceHtml=`<b>On pace to hit the limit ${fmtD(p.exhaust_ts*1000)}</b>`;
  }else if(p.pace_projection_pct!=null&&p.pace_projection_pct>100){
    paceHtml=`<b>On pace for ${Math.round(p.pace_projection_pct)}% — over the limit</b>`;
  }else if(p.projected_pct_at_reset!=null){
    paceHtml=`<b class="ok">On pace for ${Math.round(p.projected_pct_at_reset)}% at reset</b>`;
  }else{
    paceHtml=`<b class="ok">Collecting samples…</b>`;
  }
  // vs even pace: delta between actual % and where uniform burn would be now
  const expPct=(now-weekStart)/(resetT-weekStart)*100;
  const delta=pct-expPct;
  const deltaHtml=`<i>·</i> <b class="${delta>0?"":"ok"}">${delta>0?"+":""}${delta.toFixed(1)}% vs even pace</b>`;
  $("meta").innerHTML=`Weekly usage <i>·</i> Ends ${fmtD(resetT)} <i>·</i> ${paceHtml}${deltaHtml}`;

  // ---------- chart ----------
  const c=$("cv"),ctx=c.getContext("2d"),dpr=window.devicePixelRatio||1;
  const W=c.clientWidth*dpr,H=c.clientHeight*dpr; c.width=W;c.height=H;
  ctx.clearRect(0,0,W,H);ctx.lineJoin="round";

  // actual usage: only real polled samples — the gap from reset to the first
  // sample is genuinely unknown, drawn as a faint "no data" segment below
  const pts=(state.history||[]).filter(h=>h.quota&&h.quota.weekly_percentage!=null&&h.ts*1000>weekStart)
    .map(h=>({t:h.ts*1000,v:h.quota.weekly_percentage}));
  if(!pts.length) pts.push({t:now,v:pct});

  // forecast target
  const hasRate=p.rate_per_hour!=null&&p.rate_per_hour>0;
  const exhaustT=hasRate&&p.exhaust_ts?p.exhaust_ts*1000:null;

  // y domain: enough to show 100 line + forecast overshoot (like opencode 150%)
  let yMax=100*1.35;
  if(exhaustT&&exhaustT<resetT) yMax=Math.max(yMax,(100+clamp(p.rate_per_day,0,50))*1.25);
  if(p.hot_exhaust_ts&&p.hot_exhaust_ts*1000<resetT) yMax=Math.max(yMax,(100+clamp(p.hot_rate_per_day,0,80))*1.15);
  const x0=view?view.x0:weekStart, x1=view?view.x1:resetT;
  const X=t=>18+(clamp(t,x0,x1)-x0)/(x1-x0)*(W-36);
  const Y=v=>H-30-(v/yMax)*(H-50);

  // gridlines + y labels
  ctx.strokeStyle="#2c2c31";ctx.fillStyle="#6e6e76";ctx.lineWidth=1;
  ctx.font=`${10.5*dpr}px -apple-system`;
  for(const g of [0,50,100,150]){
    if(g>yMax+5)continue;
    ctx.beginPath();ctx.moveTo(18,Y(g));ctx.lineTo(W-18,Y(g));ctx.stroke();
    ctx.fillText(g+"%",20,Y(g)-6);
  }

  // even-pace reference diagonal: 0% at week start -> 100% at reset
  // actual line above this = burning faster than uniform pace; below = under
  ctx.strokeStyle="#4e4e58";ctx.setLineDash([4,5]);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(X(weekStart),Y(0));ctx.lineTo(X(resetT),Y(100));ctx.stroke();
  ctx.setLineDash([]);

  // "now" vertical marker
  ctx.strokeStyle="#3a3a41";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(X(now),Y(0));ctx.lineTo(X(now),14);ctx.stroke();
  ctx.fillStyle="#8e8e95";ctx.font=`${10*dpr}px -apple-system`;
  ctx.fillText("now",X(now)+5,22);

  // hatched forecast region (under forecast line, from last point to min(exhaust,reset))
  const lp=pts.at(-1);
  const fEnd=exhaustT&&exhaustT<resetT?exhaustT:resetT;
  const fEndV=lp?clamp(lp.v+(p.rate_per_hour??0)*(fEnd-lp.t)/36e5,lp.v,yMax):0;

  if(lp&&hasRate){
    // hatch fill between forecast line and baseline
    const pat=document.createElement("canvas");pat.width=pat.height=8;
    const pc=pat.getContext("2d");pc.strokeStyle="rgba(245,201,123,.28)";pc.lineWidth=1.4;
    pc.beginPath();pc.moveTo(-2,10);pc.lineTo(10,-2);pc.stroke();
    ctx.beginPath();ctx.moveTo(X(lp.t),Y(lp.v));
    const steps=Math.max(2,Math.round((fEnd-lp.t)/(3600e3)));
    for(let i=1;i<=steps;i++){const t=lp.t+(fEnd-lp.t)*i/steps;
      ctx.lineTo(X(t),Y(clamp(lp.v+p.rate_per_hour*(t-lp.t)/36e5,0,yMax)));}
    ctx.lineTo(X(fEnd),Y(0));ctx.lineTo(X(lp.t),Y(0));ctx.closePath();
    ctx.fillStyle=ctx.createPattern(pat,"repeat");ctx.fill();
  }

  // "no data" connector: reset (0%) -> first measured sample, faint dotted
  if(pts.length&&pts[0].t>weekStart+60e3){
    ctx.strokeStyle="#4a4a52";ctx.setLineDash([2,5]);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(X(weekStart),Y(0));ctx.lineTo(X(pts[0].t),Y(pts[0].v));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#5b5b63";ctx.font=`${10*dpr}px -apple-system`;
    const midT=(weekStart+pts[0].t)/2,midV=pts[0].v/2;
    ctx.fillText("no data — monitoring began "+fmtD(pts[0].t),X(midT)-60*dpr,Y(midV)-8);
  }

  // actual usage area + step line (integer-% quota is a staircase)
  if(pts.length){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"rgba(61,220,132,.22)");g.addColorStop(1,"rgba(61,220,132,0)");
    ctx.beginPath();ctx.moveTo(X(pts[0].t),Y(0));
    let pv=0;
    pts.forEach(pt=>{ctx.lineTo(X(pt.t),Y(pv));ctx.lineTo(X(pt.t),Y(pt.v));pv=pt.v;});
    ctx.lineTo(X(now),Y(0));ctx.closePath();ctx.fillStyle=g;ctx.fill();

    ctx.strokeStyle="#3ddc84";ctx.lineWidth=2;ctx.beginPath();
    pv=pts[0].v;ctx.moveTo(X(pts[0].t),Y(pv));
    pts.forEach((pt,i)=>{if(!i)return;ctx.lineTo(X(pt.t),Y(pv));ctx.lineTo(X(pt.t),Y(pt.v));pv=pt.v;});
    ctx.lineTo(X(now),Y(pv));ctx.stroke();
  }

  // forecast dashed line
  if(lp&&hasRate){
    ctx.strokeStyle="#f5c97b";ctx.lineWidth=2;ctx.setLineDash([7,5]);
    ctx.beginPath();ctx.moveTo(X(lp.t),Y(lp.v));
    const steps=Math.max(2,Math.round((fEnd-lp.t)/(3600e3)));
    for(let i=1;i<=steps;i++){const t=lp.t+(fEnd-lp.t)*i/steps;
      ctx.lineTo(X(t),Y(clamp(lp.v+p.rate_per_hour*(t-lp.t)/36e5,0,yMax)));}
    ctx.stroke();ctx.setLineDash([]);
    // hot-pace bound: measured recent slope — "if you keep burning like this"
    const hotR=p.hot_rate_per_day;
    if(hotR!=null&&hotR>0){
      const hotEnd=p.hot_exhaust_ts&&p.hot_exhaust_ts*1000<resetT?p.hot_exhaust_ts*1000:resetT;
      const hotEndV=clamp(lp.v+hotR/24*(hotEnd-lp.t)/36e5,0,yMax);
      ctx.strokeStyle="#c77dff";ctx.lineWidth=1.6;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.moveTo(X(lp.t),Y(lp.v));
      const hs=Math.max(2,Math.round((hotEnd-lp.t)/(3600e3)));
      for(let i=1;i<=hs;i++){const t=lp.t+(hotEnd-lp.t)*i/hs;
        ctx.lineTo(X(t),Y(clamp(lp.v+hotR/24*(t-lp.t)/36e5,0,yMax)));}
      ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="#c77dff";ctx.beginPath();ctx.arc(X(hotEnd),Y(hotEndV),3,0,7);ctx.fill();
      const hl=Math.round(hotEndV)+"%";
      ctx.font=`${10.5*dpr}px -apple-system`;
      ctx.fillText(hl,X(hotEnd)-ctx.measureText(hl).width-6,Y(hotEndV)-8);
    }
    // end marker
    ctx.fillStyle="#f5c97b";ctx.beginPath();ctx.arc(X(fEnd),Y(fEndV),4,0,7);ctx.fill();
    ctx.strokeStyle="#141416";ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle="#f5c97b";ctx.font=`bold ${10.5*dpr}px -apple-system`;
    const lbl=Math.round(fEndV)+"%";
    ctx.fillText(lbl,X(fEnd)-ctx.measureText(lbl).width-8,Y(fEndV)+4);
  }
  // last-point marker
  if(lp){
    ctx.fillStyle="#3ddc84";ctx.beginPath();ctx.arc(X(lp.t),Y(lp.v),4,0,7);ctx.fill();
    ctx.strokeStyle="#141416";ctx.lineWidth=1.6;ctx.stroke();
  }
  // 100% limit line dotted
  ctx.strokeStyle="#6e6e76";ctx.setLineDash([2,5]);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(18,Y(100));ctx.lineTo(W-18,Y(100));ctx.stroke();ctx.setLineDash([]);

  // ---------- hover crosshair + drag-select ----------
  if(dragT0!=null&&dragT1!=null&&dragT1!==dragT0){
    ctx.fillStyle="rgba(10,132,255,.10)";
    const xa=X(Math.min(dragT0,dragT1)),xb2=X(Math.max(dragT0,dragT1));
    ctx.fillRect(xa,0,xb2-xa,H-30);
  }
  if(hoverT!=null&&hoverT>x0&&hoverT<x1){
    ctx.strokeStyle="#55555f";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(X(hoverT),Y(0));ctx.lineTo(X(hoverT),14);ctx.stroke();
    // step value at hoverT: last sample <= t
    let uv=null;for(const pt of pts){if(pt.t<=hoverT)uv=pt.v;else break;}
    const tip=$("tip");
    let html=`<div class="tt">${fmtDT(hoverT)}</div>`;
    if(uv!=null)html+=`<div class="u">usage ${Math.round(uv)}%</div>`;
    if(lp&&hasRate&&hoverT>lp.t){
      const fv=clamp(lp.v+p.rate_per_hour*(hoverT-lp.t)/36e5,0,yMax);
      html+=`<div class="f">forecast ${Math.round(fv)}%</div>`;
    }
    html+=`<div class="p">even pace ${Math.round((hoverT-weekStart)/(resetT-weekStart)*100)}%</div>`;
    tip.innerHTML=html;tip.style.display="block";
    const cx=X(hoverT)/dpr;
    tip.style.left=Math.min(cx+12,c.clientWidth-tip.offsetWidth-8)+"px";
    tip.style.top="70px";
  }else{$("tip").style.display="none";}

  // ---------- x labels (adaptive density by visible span) ----------
  const xb=$("xbar");xb.innerHTML="";
  const span=x1-x0;
  const step=span>5*DAY?DAY:span>2*DAY?12*36e5:span>DAY?6*36e5:span>6*36e5?2*36e5:36e5;
  const marks=[];
  for(let t=Math.ceil(x0/step)*step;t<x1;t+=step)
    marks.push({t,l:span>2*DAY?fmtD(t):fmtDT(t).replace(", "," ")});
  marks.unshift({t:x0,l:view?fmtDT(x0):fmtD(x0)});
  if(exhaustT&&exhaustT<x1&&exhaustT>x0) marks.push({t:exhaustT,l:fmtD(exhaustT),hit:true});
  marks.push({t:x1,l:view?fmtDT(x1):fmtD(x1),end:true});
  marks.sort((a,b)=>a.t-b.t);
  marks.forEach(m=>{
    const el=document.createElement("div");
    el.className="x"+(m.hit?" hit":m.end?" end":"");
    el.textContent=m.l;
    // position: use flex auto-ish via absolute
    el.style.position="absolute";el.style.left=`calc(${(m.t-x0)/(x1-x0)*100}% - 28px)`;
    xb.appendChild(el);
  });
  xb.style.height="26px";

  // ---------- footer + minis ----------
  const rate=p.rate_per_day;
  let avgHtml=rate!=null?`Averaging <b>${rate.toFixed(1)}%</b> a day (week-to-date)`:`样本 ${p.samples??0} · 每小时自动记录`;
  if(p.hot_rate_per_day!=null&&p.hot_rate_per_day>0){
    const he=p.hot_exhaust_ts;
    avgHtml+=` · hot pace ${p.hot_rate_per_day.toFixed(1)}%/day`+(he&&he*1000<resetT?` → hits limit <b style="color:var(--hot)">${fmtD(he*1000)}</b>`:"");
  }
  $("avg").innerHTML=avgHtml;
  $("mRemain").innerHTML=`${(100-pct).toFixed(0)}<small>%</small>`;
  $("mRemainS").textContent="weekly quota left";
  $("mReset").innerHTML=fmtDur(resetT-now);
  $("mResetS").textContent="until "+fmtD(resetT)+" reset";
  $("mRate").innerHTML=rate!=null?`${rate.toFixed(1)}<small>%/day</small>`:"—";
  $("mRateS").textContent=hasRate?"week-to-date average":"need ≥2 samples";
  // 本小时/今日 deltas from measured samples
  const since=ms=>{const base=[...pts].reverse().find(pt=>pt.t<=now-ms);return base?pct-base.v:0;};
  const v1h=since(36e5);
  const dayStart=new Date();dayStart.setHours(0,0,0,0);
  const vToday=since(now-dayStart.getTime());
  $("mHour").innerHTML=`${v1h>0?"+":""}${v1h.toFixed(0)}<small>%</small>`;
  $("mHourS").textContent="burned last 60min"+(v1h===0?" · idle":"");
  $("mToday").innerHTML=`${vToday>0?"+":""}${vToday.toFixed(0)}<small>%</small>`;
  $("mTodayS").textContent="since midnight";
  $("mOver").innerHTML=`$${(q.overage_balance??0).toFixed(0)}`;
  $("mOverS").textContent="overage balance · "+(lim.max_acu_limit?lim.max_acu_limit+" ACU/session cap":"");
}

refresh(false);setInterval(()=>refresh(false),60000);
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString("en-GB")},1000);
addEventListener("resize",()=>state&&render());

// chart interaction: hover crosshair + drag-select zoom
{
  const c=$("cv");
  const tAt=e=>{const q=state.latest.quota||{};
    const rs=new Date(q.weekly_reset_at).getTime(),ws=rs-7*DAY;
    const vx0=view?view.x0:ws,vx1=view?view.x1:rs;
    return vx0+(e.offsetX-18)/(c.clientWidth-36)*(vx1-vx0);};
  c.addEventListener("mousemove",e=>{
    hoverT=tAt(e);
    if(dragT0!=null){dragT1=tAt(e);}
    if(state)render();
  });
  c.addEventListener("mouseleave",()=>{hoverT=null;dragT1=null;if(state)render();});
  c.addEventListener("mousedown",e=>{dragT0=tAt(e);dragT1=null;e.preventDefault();});
  c.addEventListener("mouseup",e=>{
    if(dragT0!=null&&dragT1!=null){
      const a=Math.min(dragT0,dragT1),b=Math.max(dragT0,dragT1);
      if(b-a>10*60e3)view={x0:a,x1:b};
    }
    dragT0=dragT1=null;if(state)render();
  });
  c.addEventListener("dblclick",()=>{view=null;if(state)render();});
  // trackpad: pinch (ctrlKey+wheel) or vertical scroll zooms toward cursor,
  // two-finger horizontal scroll pans. min zoom 1h, full range resets view.
  c.addEventListener("wheel",e=>{
    e.preventDefault();
    if(!state)return;
    const q=state.latest.quota||{};
    const rs=new Date(q.weekly_reset_at).getTime(),ws=rs-7*DAY;
    const vx0=view?view.x0:ws,vx1=view?view.x1:rs,span=vx1-vx0;
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
      const d=span*e.deltaX/(c.clientWidth*0.8);
      let a=vx0+d,b=vx1+d;
      if(a<ws){b+=ws-a;a=ws;} if(b>rs){a-=b-rs;b=rs;}
      view=(a<=ws&&b>=rs)?null:{x0:a,x1:b};
    }else{
      const f=Math.exp(e.deltaY*0.0025);
      const tc=vx0+(e.offsetX-18)/(c.clientWidth-36)*span;
      let a=tc-(tc-vx0)*f,b=tc+(vx1-tc)*f;
      if(b-a<3600e3){const m=(a+b)/2;a=m-1800e3;b=m+1800e3;}
      if(a<ws)a=ws; if(b>rs)b=rs;
      view=(b-a>=(rs-ws)*0.995)?null:{x0:a,x1:b};
    }
    render();
  },{passive:false});
}
</script>
</body>
